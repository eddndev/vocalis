name: Deploy via SSH

on:
  push:
    branches:
      - main
      - feature/syllable-recognition

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # --- STEP 1: RUST / WASM BUILD ---
      - name: 🦀 Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: 📦 Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: 🛠️ Build WASM Core
        working-directory: ./vocalis_core
        run: wasm-pack build --target web --out-dir ../vocalis/src/lib/pkg

      # --- STEP 2: ASTRO FRONTEND BUILD ---
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './vocalis/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        working-directory: ./vocalis
        run: npm ci

      - name: 🛠️ Build Astro Site
        working-directory: ./vocalis
        run: npm run build

      # --- STEP 3: DEPLOY VIA SSH ---
      - name: 🚀 Deploy via Rsync
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          # Path on the server. Ensure this folder exists or the user has rights to create it.
          TARGET: ${{ secrets.SSH_TARGET_DIR }}
          # Path from the build environment (The trailing slash is important for rsync)
          SOURCE: "vocalis/dist/"
          # Rsync arguments: recursive, links, times, compress, verbose, delete extraneous files on server
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: "/node_modules/, /.git/, /.github/"